<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f6b"/>
      <stop offset="0.55" stop-color="#5b63d8"/>
      <stop offset="1" stop-color="#a7b0ff"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f8f"/>
      <stop offset="1" stop-color="#23275e"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a52b8"/>
      <stop offset="1" stop-color="#3b42a0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="160" cy="150" r="5"/><circle cx="300" cy="90" r="3.5"/><circle cx="860" cy="130" r="4"/>
      <circle cx="760" cy="220" r="3"/><circle cx="110" cy="300" r="3"/><circle cx="420" cy="190" r="3"/>
    </g>
    <!-- sun -->
    <circle cx="760" cy="330" r="96" fill="#ffd36e"/>
    <circle cx="760" cy="330" r="128" fill="#ffd36e" opacity="0.18"/>
    <!-- clouds -->
    <g fill="#ffffff" opacity="0.9">
      <g transform="translate(150 380)">
        <ellipse cx="0" cy="0" rx="70" ry="34"/><ellipse cx="60" cy="-18" rx="56" ry="40"/><ellipse cx="120" cy="2" rx="62" ry="30"/>
      </g>
      <g transform="translate(700 470)" opacity="0.85">
        <ellipse cx="0" cy="0" rx="54" ry="26"/><ellipse cx="46" cy="-14" rx="44" ry="30"/><ellipse cx="92" cy="2" rx="48" ry="24"/>
      </g>
    </g>
    <!-- back mountains -->
    <path d="M-40 1024 L220 560 L360 760 L470 640 L640 1024 Z" fill="url(#back)"/>
    <path d="M420 1024 L760 600 L1080 1024 Z" fill="#4b53bb"/>
    <path d="M760 600 L700 675 L735 668 L760 700 L790 668 L822 676 Z" fill="#e9ecff"/>
    <!-- main peak -->
    <path d="M150 1024 L512 300 L874 1024 Z" fill="url(#peak)"/>
    <path d="M512 300 L874 1024 L700 1024 Z" fill="#1c2050" opacity="0.55"/>
    <!-- snow cap -->
    <path d="M512 300 L420 484 L462 462 L494 504 L530 458 L566 492 L604 484 Z" fill="#ffffff"/>
    <path d="M512 300 L604 484 L566 492 L548 470 Z" fill="#d7dcff"/>
    <!-- flag -->
    <rect x="506" y="190" width="12" height="120" rx="6" fill="#f2f3ff"/>
    <path d="M518 196 L640 222 L518 252 Z" fill="#3ecf8e"/>
    <path d="M518 224 L640 222 L518 252 Z" fill="#2fae74"/>
    <!-- foreground hills -->
    <path d="M-20 1024 Q 200 880 420 950 T 1044 900 L1044 1044 L-20 1044 Z" fill="#191c45"/>
  </g>
</svg>
